; PlatformIO project for the main board (ESP32-S3 round display).
; Two build environments, one per physical unit role. Update `board` once the
; exact dev kit's PlatformIO board ID is confirmed (many round-display ESP32-S3
; kits use `esp32-s3-devkitc-1` as a close-enough base — verify pinout before
; relying on this).

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3
lib_deps =

[env:parent-bot]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BOT_ROLE_PARENT

[env:kid-bot]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BOT_ROLE_KID
