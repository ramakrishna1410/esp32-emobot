; PlatformIO project for the main board (ESP32-S3 N16R8, round display).
;
; NOT YET BUILT/FLASHED IN THIS REPO'S DEV ENVIRONMENT: this sandbox has no
; network access to PlatformIO's platform registry, so this config and the
; C/C++ it builds have not been compile-tested here. Build and flash it on
; your own machine (see firmware/main-board/README.md) and report back any
; compiler errors so they can be fixed.
;
; board = esp32-s3-devkitc-1 is a generic ESP32-S3 board definition used as
; a starting point — verify it matches your exact N16R8 board's flash/PSRAM
; config (16MB flash, 8MB octal PSRAM) and adjust if your board vendor
; provides a more specific PlatformIO board ID.

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; octal PSRAM mode for N16R8-class modules — verify against your board's datasheet

build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -mfix-esp32-psram-cache-issue

lib_deps =
